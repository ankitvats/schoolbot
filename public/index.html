<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#efeee9" />
    <title>SchoolBot — Your School Assistant</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🎓</span>
        <span class="brand-name">SchoolBot</span>
      </div>
      <div class="topbar-actions">
        <button
          class="ghost-btn icon-btn theme-toggle"
          id="themeBtn"
          type="button"
          aria-label="Switch theme"
          title="Switch theme"
        >
          <svg
            class="icon-moon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
          <svg
            class="icon-sun"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            />
          </svg>
        </button>
        <button
          class="ghost-btn"
          id="clearBtn"
          type="button"
          aria-label="New chat"
          title="New chat"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
          <span>New chat</span>
        </button>
      </div>
    </header>

    <!-- Conversation; filled from the welcome template -->
    <main
      class="thread"
      id="chatMessages"
      role="log"
      aria-live="polite"
      aria-label="Conversation"
    ></main>

    <template id="welcomeTemplate">
      <div class="day-divider"><span>Today</span></div>
      <article class="turn bot-turn welcome" aria-label="SchoolBot message">
        <div class="bot-mark" aria-hidden="true">🎓</div>
        <div class="bot-body">
          <div class="bot-bubble">
            <div class="answer">
              <p>
                <span id="welcomeTitle">Hello</span>! 👋 I'm
                <strong>SchoolBot</strong>.
              </p>
              <p>
                Ask me about admissions, fees, academics, facilities, events and
                more. Pick a topic or type your question below.
              </p>
            </div>
          </div>
          <div class="suggestions">
            <button
              class="suggestion-chip"
              type="button"
              data-query="What is the fee structure?"
            >
              💰 Fee structure
            </button>
            <button
              class="suggestion-chip"
              type="button"
              data-query="What is the admission process?"
            >
              📝 Admissions
            </button>
            <button
              class="suggestion-chip"
              type="button"
              data-query="What are the school timings?"
            >
              🕐 School timings
            </button>
            <button
              class="suggestion-chip"
              type="button"
              data-query="What subjects are offered?"
            >
              📚 Subjects
            </button>
            <button
              class="suggestion-chip"
              type="button"
              data-query="What are the upcoming events?"
            >
              🎉 Events
            </button>
            <button
              class="suggestion-chip"
              type="button"
              data-query="What is the school address?"
            >
              📞 Contact
            </button>
          </div>
        </div>
      </article>
    </template>

    <footer class="composer-area">
      <form class="composer" id="composer">
        <textarea
          id="userInput"
          aria-label="Ask a question"
          placeholder="Type a message…"
          rows="1"
          maxlength="500"
        ></textarea>
        <span class="char-count" id="charCount" aria-live="polite"></span>
        <button
          class="send-btn"
          id="sendBtn"
          type="submit"
          aria-label="Send message"
          disabled
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 19V5" />
            <path d="m5 12 7-7 7 7" />
          </svg>
        </button>
      </form>
      <p class="composer-hint">Enter to send · Shift + Enter for a new line</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
